name: AIStudio

options:
  bundleIdPrefix: com.labs
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    DEVELOPMENT_TEAM: 5MT2PBNQ85
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ApphudSDK:
    url: https://github.com/apphud/ApphudSDK
    exactVersion: 4.6.1

fileGroups:
  - AIStudio.storekit

targets:
  AIStudio:
    type: application
    platform: iOS
    sources:
      - path: AIStudio
        # Локальный файл машины; без него в проекте нет битой ссылки в чистом клоне.
        excludes:
          - Resources/Config/Secrets.xcconfig
    configFiles:
      Debug: AIStudio/Resources/Config/Base.xcconfig
      Release: AIStudio/Resources/Config/Base.xcconfig
    dependencies:
      - package: ApphudSDK
    info:
      path: AIStudio/Resources/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
        UILaunchScreen:
          UIColorName: background
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: Choose a photo to turn into a video.
        NSPhotoLibraryAddUsageDescription: Save your generated videos to Photos.
        APIToken: $(API_TOKEN)
        ApphudAPIKey: $(APPHUD_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.labs.fviu
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        # Цвета берутся только через `Palette`, поэтому без сокращений `UIColor.<name>`
        # (они бы ещё и конфликтовали с системными именами вроде `separator`).
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

  AIStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AIStudioTests
    dependencies:
      - target: AIStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.labs.fviu.tests

schemes:
  AIStudio:
    build:
      targets:
        AIStudio: all
        AIStudioTests: [test]
    run:
      config: Debug
      # Локальный App Store для симулятора: песочница не знает продуктов этого бандла.
      storeKitConfiguration: AIStudio.storekit
      commandLineArguments:
        "-startScreen onboarding": false
        "-startScreen paywall": false
        "-startScreen main": false
        "-startScreen chat": false
        "-startScreen history": false
        "-startScreen settings": false
        "-startScreen videoTemplates": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AIStudioTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
